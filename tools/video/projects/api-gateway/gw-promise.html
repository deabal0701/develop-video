<!doctype html>
<meta charset="utf-8">
<title>gw promise</title>
<!-- 약속 — 훅이 던진 대비(서버 여섯 vs 주소 하나)를 여기서 풀고, 문 하나를 세운 뒤
     오늘 볼 세 가지를 건다. 목차를 늘어놓지 않고 동사 셋만 건다.

     내레이션(122자 / 실측 22.00초 = 초당 5.5자):
       0.0~ 8.7  쇼핑 앱에서 장바구니를 열면 뒤에서 회원·상품·재고·가격·배송·결제 서버가
                 → 서버 칩 6개가 3.6s 부터 차례로
       8.7~11.9  그런데 앱은 주소를 하나만 압니다              → 주소 칩 9.0s
      11.9~15.5  그 앞에 문이 하나 서 있기 때문입니다          → **문 12.2s**
      15.5~18.9  오늘은 이 문이 하는 일 셋을 봅니다
      18.9~22.0  모으고, 나누고, 지키는 일입니다               → 항목 19.2 / 20.1 / 21.0

     ※ 앞판은 13초용이라 문이 3.4초에 섰다. 훅에서 덜어낸 설명이 이리로 오면서 22초가 됐고,
       그대로 두면 앞 12초가 빈 화면이 된다 — 구간 길이가 바뀌면 도식도 다시 짠다.

     params: title · wipe=off
     주의: `animation:` 단축 속성 금지. -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  :root { --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }

  .stage { padding: 0 12%; gap: 3.2vh; }

  .head {
    font-size: 4.6vh;
    font-weight: 800;
    letter-spacing: -0.03em;
    animation-name: fadeUp;
    animation-duration: 0.6s;
  }

  /* 서버 여섯 — 훅에서 본 그 여섯이 이름을 얻는다 */
  .servers { display: flex; gap: 1.2vh; }
  .srv {
    padding: 1.1vh 1.8vh;
    border-radius: 1vh;
    background: #131c31;
    border: 0.2vh solid #263657;
    font-size: 2.2vh;
    font-weight: 700;
    color: #c8d4f0;
    animation-name: fadeUp;
    animation-duration: 0.4s;
  }
  .n1 { animation-delay: 3.6s; }
  .n2 { animation-delay: 4.3s; }
  .n3 { animation-delay: 5.0s; }
  .n4 { animation-delay: 5.7s; }
  .n5 { animation-delay: 6.4s; }
  .n6 { animation-delay: 7.1s; }

  /* 앱이 아는 주소 하나 */
  .addr {
    font-family: var(--mono);
    font-size: 2.4vh;
    font-weight: 800;
    color: #dbe5ff;
    padding: 0.9vh 2vh;
    border-radius: 1vh;
    border: 0.24vh solid var(--brand);
    background: rgb(9 14 26 / 0.9);
    animation-name: fadeUp;
    animation-duration: 0.45s;
    animation-delay: 9.0s;
  }

  /* 문 — 아치가 바닥에서 자란다 */
  .gate {
    position: relative;
    width: 24vh;
    height: 17vh;
    opacity: 0;
    animation-name: gaterise;
    animation-duration: 0.8s;
    animation-delay: 12.2s;
    animation-fill-mode: forwards;
    animation-timing-function: cubic-bezier(0.2, 0.75, 0.2, 1);
  }
  @keyframes gaterise {
    from { opacity: 0; transform: translateY(3vh) scaleY(0.7); }
    to   { opacity: 1; transform: translateY(0) scaleY(1); }
  }
  .gate .arch {
    position: absolute;
    inset: 0;
    border: 0.55vh solid var(--brand);
    border-bottom: none;
    border-radius: 12vh 12vh 0 0;
    box-shadow: 0 0 4vh color-mix(in srgb, var(--brand) 35%, transparent);
  }
  .gate .core {
    position: absolute;
    left: 50%;
    top: 56%;
    width: 7vh;
    height: 7vh;
    margin: -3.5vh 0 0 -3.5vh;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--brand) 70%, transparent), transparent 70%);
  }

  .items { display: flex; gap: 2.4vh; }
  .item {
    min-width: 19vh;
    padding: 2vh 1.8vh;
    border-radius: 1.4vh;
    background: #111a2d;
    border: 0.2vh solid #2a3a5f;
    border-top: 0.4vh solid var(--brand);
    text-align: center;
    animation-name: fadeUp;
    animation-duration: 0.5s;
  }
  .item .verb { font-size: 3.2vh; font-weight: 800; }
  .item .sub { margin-top: 0.7vh; font-size: 2vh; font-weight: 600; color: #93a4c8; }
  .i1 { animation-delay: 19.2s; }
  .i2 { animation-delay: 20.1s; }
  .i3 { animation-delay: 21.0s; }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="head animated" data-p="title"></div>

  <div class="servers">
    <div class="srv n1 animated">회원</div>
    <div class="srv n2 animated">상품</div>
    <div class="srv n3 animated">재고</div>
    <div class="srv n4 animated">가격</div>
    <div class="srv n5 animated">배송</div>
    <div class="srv n6 animated">결제</div>
  </div>

  <div class="addr animated">https://api.shop.com</div>

  <div class="gate animated">
    <i class="arch"></i>
    <i class="core"></i>
  </div>

  <div class="items">
    <div class="item i1 animated">
      <div class="verb">모으고</div>
      <div class="sub">주소를 하나로</div>
    </div>
    <div class="item i2 animated">
      <div class="verb">나누고</div>
      <div class="sub">알맞은 곳으로</div>
    </div>
    <div class="item i3 animated">
      <div class="verb">지키고</div>
      <div class="sub">검사는 한자리에서</div>
    </div>
  </div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
