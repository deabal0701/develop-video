<!doctype html>
<meta charset="utf-8">
<title>gw recap</title>
<!-- 정리 — 배운 셋이 내레이션 순서로 쌓인다. 각 줄에 **일상어 + 정식 용어를 병기**해
     "오늘 배운 말" 자체가 산출물이 되게 한다(develop-lecture recap 규칙).

     내레이션(79자 · 초당 6.4자):
       0.0~0.9   정리합니다
       0.9~5.8   API 게이트웨이는 여러 서버 앞에 세우는 하나의 문   → 문 1.2s
       5.8~7.7   주소를 하나로 모으고                              → 1행 5.9s
       7.7~10.2  요청을 알맞은 곳으로 보내고                        → 2행 8.0s
      10.2~12.3  검사를 한자리에서 합니다                           → 3행 10.4s

     ※ 위 시각은 설계값(초당 6.4자)이다. **실제 지연은 --only tts 실측(79자 / 11.40초
       = 초당 6.9자)에 맞춰 x0.924 로 재계산해 넣었다** — 구간마다 문장 수가 달라
       TTS 의 문장 간 호흡이 다르게 붙는다. 대본을 고치면 다시 재야 한다.

     params: title · wipe=off
     주의: `animation:` 단축 속성 금지. -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  :root { --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }

  .stage { padding: 0 14%; gap: 3.4vh; }

  .head {
    font-size: 4.6vh;
    font-weight: 800;
    letter-spacing: -0.03em;
    animation-name: fadeUp;
    animation-duration: 0.7s;
  }

  .gate {
    position: relative;
    width: 15vh;
    height: 9.5vh;
    animation-name: fadeUp;
    animation-duration: 0.6s;
    animation-delay: 1.1s;
  }
  .gate .arch {
    position: absolute;
    inset: 0;
    border: 0.5vh solid var(--brand);
    border-bottom: none;
    border-radius: 7.5vh 7.5vh 0 0;
    box-shadow: 0 0 3vh color-mix(in srgb, var(--brand) 35%, transparent);
  }

  .rows { display: flex; flex-direction: column; gap: 1.4vh; width: 100%; }
  .row {
    display: grid;
    grid-template-columns: 4.6vh 1fr auto;
    align-items: center;
    gap: 2vh;
    padding: 1.7vh 2.2vh;
    border-radius: 1.3vh;
    background: #111a2d;
    border: 0.2vh solid #2a3a5f;
    border-left: 0.45vh solid var(--brand);
    text-align: left;
    animation-name: fadeUp;
    animation-duration: 0.5s;
  }
  .row .n {
    width: 4.6vh;
    height: 4.6vh;
    border-radius: 50%;
    background: color-mix(in srgb, var(--brand) 22%, transparent);
    border: 0.2vh solid var(--brand);
    color: var(--brand-soft);
    font-size: 2.3vh;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .row .plain { font-size: 2.9vh; font-weight: 800; color: #e4ebff; }
  .row .term {
    text-align: right;
    font-family: var(--mono);
    font-size: 2vh;
    font-weight: 700;
    color: var(--brand-soft);
    white-space: nowrap;
  }
  .row .term small { display: block; font-family: inherit; font-size: 1.6vh; color: #7f92bb; }
  .r1 { animation-delay: 5.5s; }
  .r2 { animation-delay: 7.4s; }
  .r3 { animation-delay: 9.6s; }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="head animated" data-p="title"></div>

  <div class="gate animated">
    <i class="arch"></i>
  </div>

  <div class="rows">
    <div class="row r1 animated">
      <span class="n">1</span>
      <span class="plain">주소를 하나로 모은다</span>
      <span class="term">Single Entry Point<small>단일 진입점</small></span>
    </div>
    <div class="row r2 animated">
      <span class="n">2</span>
      <span class="plain">알맞은 곳으로 보낸다</span>
      <span class="term">Routing<small>라우팅</small></span>
    </div>
    <div class="row r3 animated">
      <span class="n">3</span>
      <span class="plain">검사를 한자리에서 한다</span>
      <span class="term">Auth · Rate Limiting<small>인증 · 요청 제한</small></span>
    </div>
  </div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
