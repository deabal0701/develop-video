<!doctype html>
<meta charset="utf-8">
<title>llm next word</title>
<!-- 2장 — LLM 의 심장. 미완성 문장 아래 후보 단어 확률판이 뜨고, 1순위가 선택돼 문장에
     붙고, 다시 새 후보판이 뜬다 — 같은 동작의 반복으로 문장이 자라는 것을 두 라운드로
     보여준다. 막대는 길이만(숫자 없음) + '예시' 워터마크.
     params: t1(1라운드 후보판) · t2(1라운드 선택) · t3(2라운드 후보판) · t4(2라운드 선택) ·
             t5(반복 배지) · wipe=off -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  :root { --bg: #05070d; --t1: 14s; --t2: 22s; --t3: 30s; --t4: 34s; --t5: 40s; }

  .stage { padding: 0 12%; gap: 5vh; }

  .head {
    font-size: 4.4vh;
    font-weight: 800;
    letter-spacing: -0.02em;
    animation-name: fadeUp;
    animation-duration: 0.6s;
  }
  .head b { color: var(--brand-soft); }

  /* ── 자라는 문장 ── */
  .line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.4vh;
    font-size: 4.8vh;
    font-weight: 800;
    min-height: 8vh;
    animation-name: fadeUp;
    animation-duration: 0.6s;
    animation-delay: 0.3s;
  }
  .line .got { color: #eef2fc; }
  .line .new1, .line .new2 {
    color: var(--brand-soft);
    opacity: 0;
    animation-name: snapin;
    animation-duration: 0.45s;
    animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .line .new1 { animation-delay: calc(var(--t2) + 0.5s); }
  .line .new2 { animation-delay: calc(var(--t4) + 0.5s); }
  @keyframes snapin {
    from { opacity: 0; transform: translateY(6vh) scale(0.8); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .caret {
    width: 0.5ch;
    height: 5vh;
    background: #eef2fc;
    animation-name: blink;
    animation-duration: 0.55s;
    animation-iteration-count: infinite;
    animation-timing-function: steps(2, jump-none);
  }
  @keyframes blink { from { opacity: 1; } to { opacity: 0; } }

  /* ── 후보판 두 라운드 — 같은 자리에 겹쳐 두고 시간으로 갈아끼운다 ── */
  .panelzone { position: relative; width: 100%; height: 30vh; }
  /* 등장은 래퍼(pwrap), 퇴장은 패널이 맡는다 — 한 요소에 콤마로 두 애니메이션을 걸면
     두 번째(from: opacity 1)의 backwards fill 이 지연 전에 적용돼 판이 미리 보인다(실측). */
  .pwrap {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    margin: 0 auto;
    width: 58vh;
    opacity: 0;
    animation-name: fadeUp;
    animation-duration: 0.55s;
  }
  .pwrap.r1 { animation-delay: var(--t1); }
  .pwrap.r2 { animation-delay: var(--t3); }
  .panel {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 1.7vh;
    padding: 2.8vh 3.4vh 2.4vh;
    border-radius: 1.8vh;
    background: rgb(13 19 36 / 0.92);
    border: 0.2vh solid #2c3a60;
    opacity: 0;
  }
  .panel .ex {
    position: absolute;
    top: 1.2vh;
    right: 1.7vh;
    font-size: 1.7vh;
    font-weight: 700;
    color: #55648a;
    letter-spacing: 0.08em;
  }
  .panel .cap {
    font-size: 2.1vh;
    font-weight: 700;
    color: #6d7ea6;
    text-align: left;
  }
  .panel.animated {
    animation-name: panelout;
    animation-duration: 0.45s;
  }
  .r1 .panel.animated { animation-delay: calc(var(--t2) + 1.1s); }
  .r2 .panel.animated { animation-delay: calc(var(--t4) + 1.1s); }
  @keyframes panelout { from { opacity: 1; } to { opacity: 0; } }

  .cand { position: relative; display: flex; align-items: center; gap: 2.2vh; }
  .cand .w { width: 20vh; text-align: right; font-size: 3vh; font-weight: 700; color: #cfd9f2; }
  .cand .bar { flex: 1; height: 1.8vh; border-radius: 1vh; background: #1c2745; overflow: hidden; }
  .cand .bar i {
    display: block;
    height: 100%;
    border-radius: 1vh;
    background: linear-gradient(90deg, var(--brand), #6b8bff);
    transform-origin: left center;
    transform: scaleX(0);
    animation-name: barfill;
    animation-duration: 0.7s;
    animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  @keyframes barfill { from { transform: scaleX(0); } to { transform: scaleX(var(--p, 0.5)); } }
  .cand.b .bar i { opacity: 0.55; }
  .cand.c .bar i { opacity: 0.35; }
  .r1 .cand.a .bar i { animation-delay: calc(var(--t1) + 0.4s); }
  .r1 .cand.b .bar i { animation-delay: calc(var(--t1) + 0.65s); }
  .r1 .cand.c .bar i { animation-delay: calc(var(--t1) + 0.9s); }
  .r2 .cand.a .bar i { animation-delay: calc(var(--t3) + 0.4s); }
  .r2 .cand.b .bar i { animation-delay: calc(var(--t3) + 0.65s); }
  .r2 .cand.c .bar i { animation-delay: calc(var(--t3) + 0.9s); }

  .pick {
    position: absolute;
    inset: -0.8vh -1.2vh;
    border-radius: 1.3vh;
    border: 0.32vh solid #7fe3a8;
    box-shadow: 0 0 2.4vh rgb(127 227 168 / 0.4);
    opacity: 0;
    animation-name: pickin;
    animation-duration: 0.4s;
  }
  .r1 .pick { animation-delay: var(--t2); }
  .r2 .pick { animation-delay: var(--t4); }
  @keyframes pickin { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }

  /* ── 반복 배지 ── */
  .again {
    position: absolute;
    left: 0;
    right: 0;
    top: 6vh;
    text-align: center;
    font-size: 3.4vh;
    font-weight: 800;
    color: var(--brand-soft);
    opacity: 0;
    animation-name: fadeUp;
    animation-duration: 0.6s;
    animation-delay: var(--t5);
  }
  .again .loop {
    display: inline-block;
    margin-right: 1.4vh;
    animation-name: spin;
    animation-duration: 2.4s;
    animation-delay: var(--t5);
    animation-iteration-count: infinite;
    animation-timing-function: linear;
  }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .again small { display: block; margin-top: 1vh; font-size: 2.3vh; font-weight: 600; color: #8ea0c8; }

  /* 전부 같은 동작 — 활용 칩 3개 (내레이션 «번역도, 요약도» 시각) */
  .uses {
    position: absolute;
    left: 0;
    right: 0;
    top: 17vh;
    display: flex;
    justify-content: center;
    gap: 2.2vh;
  }
  .use {
    padding: 1.3vh 2.6vh;
    border-radius: 3vh;
    background: #0e1526;
    border: 0.2vh solid #24304f;
    font-size: 2.6vh;
    font-weight: 700;
    color: #cfd9f2;
    opacity: 0;
    animation-name: fadeUp;
    animation-duration: 0.5s;
  }
  .use.u1 { animation-delay: var(--t6, 44s); }
  .use.u2 { animation-delay: calc(var(--t6, 44s) + 0.4s); }
  .use.u3 { animation-delay: calc(var(--t6, 44s) + 0.8s); }
  .use b { color: var(--brand-soft); }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="head animated">하는 일은 하나 — <b>다음 단어 맞히기</b></div>

  <div class="line animated">
    <span class="got">오늘도</span><span class="new1 animated">고생</span><span class="new2 animated">많으셨습니다.</span><span class="caret animated"></span>
  </div>

  <div class="panelzone">
    <div class="pwrap r1 animated">
    <div class="panel animated">
      <span class="ex">예시</span>
      <span class="cap">다음 조각 후보</span>
      <div class="cand a"><span class="pick animated"></span><span class="w">고생</span><span class="bar"><i class="animated" style="--p:0.86"></i></span></div>
      <div class="cand b"><span class="w">회의</span><span class="bar"><i class="animated" style="--p:0.42"></i></span></div>
      <div class="cand c"><span class="w">야근</span><span class="bar"><i class="animated" style="--p:0.19"></i></span></div>
    </div>
    </div>

    <div class="pwrap r2 animated">
    <div class="panel animated">
      <span class="ex">예시</span>
      <span class="cap">다음 조각 후보 — 방금 고른 단어까지 읽고 다시 계산</span>
      <div class="cand a"><span class="pick animated"></span><span class="w">많으셨습니다</span><span class="bar"><i class="animated" style="--p:0.83"></i></span></div>
      <div class="cand b"><span class="w">하셨죠</span><span class="bar"><i class="animated" style="--p:0.4"></i></span></div>
      <div class="cand c"><span class="w">많네요</span><span class="bar"><i class="animated" style="--p:0.22"></i></span></div>
    </div>
    </div>

    <div class="again animated"><span class="loop animated">⟳</span>고르고, 붙이고, 다시 고르고<small>이 반복이 여러분이 받는 그 긴 답장이 된다</small></div>

    <div class="uses">
      <span class="use u1 animated">번역</span>
      <span class="use u2 animated">요약</span>
      <span class="use u3 animated">보고서 초안</span>
    </div>
  </div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  const timing = { t1: q.get('t1'), t2: q.get('t2'), t3: q.get('t3'), t4: q.get('t4'), t5: q.get('t5'), t6: q.get('t6') };
  for (const [k, v] of Object.entries(timing)) {
    if (v) root.style.setProperty(`--${k}`, `${v}s`);
  }
</script>
