<!doctype html>
<meta charset="utf-8">
<title>llm recap</title>
<!-- 정리 — 배운 세 문장이 내레이션 순서로 쌓인다 (rest-outro 패턴).
     params: t1·t2·t3(행 등장 s) · tn(마무리 문구 s) · wipe=off -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  :root { --bg: #05070d; --t1: 4s; --t2: 10s; --t3: 16s; --tn: 22s; }

  .stage { padding: 0 16%; gap: 4.2vh; }

  .head {
    font-size: 4.8vh;
    font-weight: 800;
    letter-spacing: -0.02em;
    animation-name: fadeUp;
    animation-duration: 0.6s;
  }
  .head b { color: var(--brand-soft); }

  .rows { display: flex; flex-direction: column; gap: 2.8vh; width: 100%; }
  .row {
    display: flex;
    align-items: center;
    gap: 2.8vh;
    padding: 2.5vh 3.4vh;
    border-radius: 1.8vh;
    background: #0e1526;
    border: 0.2vh solid #24304f;
    text-align: left;
    opacity: 0;
    animation-name: rowin;
    animation-duration: 0.55s;
    animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .row.r1 { animation-delay: var(--t1); }
  .row.r2 { animation-delay: var(--t2); }
  .row.r3 { animation-delay: var(--t3); }
  @keyframes rowin {
    from { opacity: 0; transform: translateY(3.5vh); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .key {
    flex: none;
    width: 22vh;
    font-size: 3.1vh;
    font-weight: 800;
    color: var(--brand-soft);
  }
  .val { font-size: 2.9vh; font-weight: 600; color: #cfd9f2; }

  .note {
    font-size: 3vh;
    font-weight: 700;
    color: var(--brand-soft);
    opacity: 0;
    animation-name: fadeUp;
    animation-duration: 0.6s;
    animation-delay: var(--tn);
  }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="head animated">LLM의 심장, <b>세 문장</b></div>

  <div class="rows">
    <div class="row r1 animated"><span class="key">찾지 않는다</span><span class="val">저장된 답이 아니라, 그 자리에서 만든다</span></div>
    <div class="row r2 animated"><span class="key">다음 단어</span><span class="val">확률로 한 조각 고르고, 붙이고, 다시 고른다</span></div>
    <div class="row r3 animated"><span class="key">예습</span><span class="val">방대한 글로 한 빈칸 맞히기가 그 감각을 만들었다</span></div>
  </div>

  <div class="note animated">이 세 문장이면, 심장은 다 본 겁니다</div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  const timing = { t1: q.get('t1'), t2: q.get('t2'), t3: q.get('t3'), tn: q.get('tn') };
  for (const [k, v] of Object.entries(timing)) {
    if (v) root.style.setProperty(`--${k}`, `${v}s`);
  }
</script>
