<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>TodoStore API 콘솔</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #141c33;
    --panel-2: #0f1628;
    --line: #26314f;
    --fg: #e8ecf8;
    --muted: #8e9ac0;
    --brand: #3e63dd;
    --brand-soft: #93a4f5;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 700px at 20% -10%, #1a2547 0%, var(--bg) 60%);
    color: var(--fg);
    font: 400 19px/1.5 "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 22px 40px;
    border-bottom: 1px solid var(--line);
    background: rgba(11, 16, 32, .7);
  }
  .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(140deg, var(--brand), #7b5cf0);
    display: grid; place-items: center;
    font-weight: 800; font-size: 19px; letter-spacing: -.02em;
  }
  .brandname { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  /* 오른쪽 위는 비워 둔다 — 완성본에서 워터마크가 앉는 자리라 뱃지와 겹친다. */
  .host {
    font-family: var(--mono); font-size: 18px; color: var(--muted);
    padding: 8px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2);
  }

  main {
    display: grid;
    grid-template-columns: 1fr 92px 1fr;
    gap: 0;
    /* 아래 230px 은 비워 둔다 — 완성본에서 자막이 구워지는 자리다. */
    padding: 26px 40px 230px;
    height: calc(100% - 85px);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px 26px;
    display: flex; flex-direction: column; gap: 12px;
    min-height: 0;
  }
  .card h2 {
    margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 10px;
  }
  .card h2 small { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--muted); }

  .label { font-size: 15px; color: var(--muted); margin-bottom: 7px; letter-spacing: .02em; }

  .methods { display: flex; gap: 10px; }
  .methods button {
    flex: 1; padding: 12px 0; border-radius: 11px; cursor: pointer;
    font: 700 18px/1 var(--mono); letter-spacing: .04em;
    color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
    transition: all .18s ease;
  }
  .methods button[aria-pressed="true"] { color: #fff; background: var(--brand); border-color: #6a86ea; }
  #m-delete[aria-pressed="true"] { background: #b4444d; border-color: #d9656d; }

  input, textarea {
    width: 100%; color: var(--fg); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 11px;
    padding: 13px 15px; font: 400 18px/1.45 var(--mono);
    outline: none;
  }
  input:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(62,99,221,.22); }
  textarea { resize: none; height: 88px; }
  .urlrow { display: flex; align-items: center; gap: 0; }
  .urlrow .base {
    font: 400 18px/1.45 var(--mono); color: var(--muted);
    background: #0c1425; border: 1px solid var(--line); border-right: 0;
    border-radius: 11px 0 0 11px; padding: 13px 12px 13px 15px; white-space: nowrap;
  }
  .urlrow input { border-radius: 0 11px 11px 0; }

  #send {
    margin-top: 2px; padding: 15px 0; border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--brand), #6c4de6); color: #fff;
    font: 700 20px/1 "Pretendard", -apple-system, sans-serif; letter-spacing: -.01em;
    box-shadow: 0 8px 22px rgba(62,99,221,.35);
  }
  #send:active { transform: translateY(1px); }

  .raw {
    margin-top: auto; height: 156px; flex: none;
    background: #080d1a; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; font: 400 16px/1.55 var(--mono); color: #b9c4e6;
    white-space: pre; overflow: hidden;
  }
  .raw .k { color: var(--brand-soft); }
  .raw .m { color: var(--ok); font-weight: 700; }

  /* 가운데 통로 — 요청이 서버로 갔다 오는 것을 눈에 보이게 한다 */
  .lane { position: relative; display: grid; place-items: center; }
  .lane::before {
    content: ""; position: absolute; left: 50%; top: 12%; bottom: 12%; width: 2px;
    background: linear-gradient(180deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
    transform: translateX(-50%);
  }
  .pkt {
    position: absolute; left: 50%; top: 46%;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--brand-soft); box-shadow: 0 0 18px 5px rgba(147,164,245,.55);
    transform: translate(-50%, -50%) scale(0); opacity: 0;
  }
  .lane.busy .pkt { animation-name: fly; animation-duration: .52s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
  @keyframes fly {
    0%   { transform: translate(-50%, -50%) translateY(-42px) scale(.6); opacity: 0; }
    50%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) translateY(42px) scale(.6); opacity: 0; }
  }

  /* 응답 */
  .statusrow { display: flex; align-items: baseline; gap: 14px; }
  #status {
    font: 800 46px/1 var(--mono); letter-spacing: -.02em; color: var(--muted);
  }
  #status-text { font-size: 21px; font-weight: 600; color: var(--muted); }
  #status.ok, #status.ok + #status-text { color: var(--ok); }
  #status.warn, #status.warn + #status-text { color: var(--warn); }
  #status.err, #status.err + #status-text { color: var(--err); }
  #meta { margin-left: auto; font: 400 16px var(--mono); color: var(--muted); }

  pre {
    margin: 0; background: #080d1a; border: 1px solid var(--line); border-radius: 12px;
    padding: 15px 17px; font: 400 17px/1.62 var(--mono); color: #c6d0ee;
    white-space: pre-wrap; overflow: auto;
  }
  #res-headers { max-height: 168px; flex: none; }
  #res-body { flex: 1; min-height: 0; font-size: 18px; }
  .s-key { color: var(--brand-soft); }
  .s-str { color: #8fe3b6; }
  .s-num { color: #f0b46a; }
  .s-bool { color: #e08fd8; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="logo">T</div>
    <div class="brandname">TodoStore API 콘솔</div>
    <div class="host" id="host">http://localhost:4310</div>
  </header>

  <main>
    <!-- 요청 -->
    <section class="card" id="req-card">
      <h2>요청 <small>Request</small></h2>

      <div>
        <div class="label">메서드 — 무엇을 할 것인가</div>
        <div class="methods">
          <button id="m-get" aria-pressed="true">GET</button>
          <button id="m-post" aria-pressed="false">POST</button>
          <button id="m-delete" aria-pressed="false">DELETE</button>
        </div>
      </div>

      <div>
        <div class="label">경로 — 무엇을 대상으로</div>
        <div class="urlrow">
          <span class="base">http://localhost:4310</span>
          <input id="path" value="/api/todos" spellcheck="false" />
        </div>
      </div>

      <div>
        <div class="label">Authorization 헤더 — 누구인가</div>
        <input id="token" placeholder="(비어 있음)" spellcheck="false" />
      </div>

      <div>
        <div class="label">본문 (JSON) — 보낼 데이터</div>
        <textarea id="body" spellcheck="false" placeholder="{ }"></textarea>
      </div>

      <button id="send">보내기</button>

      <div class="raw" id="req-raw"></div>
    </section>

    <div class="lane" id="lane"><div class="pkt"></div></div>

    <!-- 응답 -->
    <section class="card" id="res-card">
      <h2>응답 <small>Response</small></h2>

      <div class="statusrow">
        <span id="status">—</span><span id="status-text">아직 보내지 않았습니다</span>
        <span id="meta"></span>
      </div>

      <div>
        <div class="label">응답 헤더</div>
        <pre id="res-headers"><span class="empty">—</span></pre>
      </div>

      <div class="label" style="margin-bottom:-8px">응답 본문</div>
      <pre id="res-body"><span class="empty">보내기를 누르면 여기에 서버의 답이 표시됩니다.</span></pre>
    </section>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const BASE = location.origin;
  $('host').textContent = BASE;
  document.querySelector('.base').textContent = BASE;

  let method = 'GET';
  const chips = { GET: $('m-get'), POST: $('m-post'), DELETE: $('m-delete') };
  for (const [name, el] of Object.entries(chips)) {
    el.addEventListener('click', () => {
      method = name;
      for (const [n, e] of Object.entries(chips)) e.setAttribute('aria-pressed', String(n === name));
      drawRaw();
    });
  }

  const STATUS_TEXT = {
    200: 'OK — 잘 처리했습니다',
    201: 'Created — 새로 만들었습니다',
    204: 'No Content — 처리했고 돌려줄 내용은 없습니다',
    400: 'Bad Request — 보낸 값이 잘못됐습니다',
    401: 'Unauthorized — 누구인지 모르겠습니다',
    404: 'Not Found — 그런 건 없습니다',
    405: 'Method Not Allowed — 그 방법은 안 됩니다',
    500: 'Internal Server Error — 서버가 잘못했습니다',
  };
  const cls = (s) => (s < 300 ? 'ok' : s < 400 ? 'warn' : 'err');

  function drawRaw() {
    const p = $('path').value || '/';
    const t = $('token').value.trim();
    const b = $('body').value.trim();
    const lines = [`<span class="m">${method}</span> <span class="k">${p}</span> HTTP/1.1`];
    if (t) lines.push(`Authorization: ${t}`);
    if (b && method !== 'GET') lines.push('Content-Type: application/json', '', b.replace(/\s+/g, ' '));
    $('req-raw').innerHTML = lines.join('\n');
  }
  for (const id of ['path', 'token', 'body']) $(id).addEventListener('input', drawRaw);

  // 칸을 누르면 들어 있던 값이 통째로 선택된다. 콘솔에서 흔한 동작이고, 촬영할 때
  // "지우고 다시 치기"를 키 조합 없이 처리할 수 있다 — 그냥 치면 갈아 끼워진다.
  //
  // mousedown 을 막고 그 자리에서 focus+select 까지 끝낸다. focus 이벤트에서 setTimeout 으로
  // 미루면 첫 글자가 들어간 뒤에 선택이 걸려 그 글자를 잡아먹는다("/api/todos" → "api/todos").
  for (const id of ['path', 'token', 'body']) {
    const el = $(id);
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      el.focus();
      el.select();
    });
  }
  drawRaw();

  const paint = (text) =>
    text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/"([^"]+)":/g, '<span class="s-key">"$1"</span>:')
      .replace(/: "([^"]*)"/g, ': <span class="s-str">"$1"</span>')
      .replace(/: (-?\d+(?:\.\d+)?)/g, ': <span class="s-num">$1</span>')
      .replace(/: (true|false|null)/g, ': <span class="s-bool">$1</span>');

  $('send').addEventListener('click', async () => {
    const path = $('path').value || '/';
    const token = $('token').value.trim();
    const body = $('body').value.trim();

    $('lane').classList.add('busy');
    $('status').textContent = '···';
    $('status').className = '';
    $('status-text').textContent = '서버에 다녀오는 중';
    $('meta').textContent = '';

    const started = performance.now();
    const init = { method, headers: {} };
    if (token) init.headers.Authorization = token;
    if (body && method !== 'GET') {
      init.headers['Content-Type'] = 'application/json';
      init.body = body;
    }

    let res, text = '';
    try {
      // 앞 슬래시를 빠뜨려도 origin 기준으로 붙는다 — "api/todos" 도 /api/todos 로 간다.
      res = await fetch(new URL(path, BASE), init);
      text = await res.text();
    } catch (e) {
      $('lane').classList.remove('busy');
      $('status').textContent = '×';
      $('status').className = 'err';
      $('status-text').textContent = '요청이 서버에 닿지 못했습니다';
      return;
    }
    const ms = Math.round(performance.now() - started);
    $('lane').classList.remove('busy');

    $('status').textContent = String(res.status);
    $('status').className = cls(res.status);
    $('status-text').textContent = STATUS_TEXT[res.status] ?? res.statusText;
    $('meta').textContent = `${ms} ms`;

    const shown = ['content-type', 'content-length', 'location', 'allow', 'x-request-id'];
    const hdr = [...res.headers.entries()]
      .filter(([k]) => shown.includes(k))
      .map(([k, v]) => `${k}: ${v}`)
      .join('\n');
    $('res-headers').innerHTML = hdr ? paint(hdr) : '<span class="empty">—</span>';

    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch {}
    $('res-body').innerHTML = pretty
      ? paint(pretty)
      : '<span class="empty">(본문 없음 — 204 는 돌려줄 내용이 없다는 뜻입니다)</span>';
  });
</script>
</body>
</html>
