<!doctype html>
<meta charset="utf-8">
<title>매달은 임시값</title>
<!-- 3장 도식 — 12개월 임시값이 쌓이고 2월에 한 번 정산으로 맞춰진다.
     기법: 상태 변화(막대 12개가 차례로 서고, 마지막에 정산 칸이 붙는다).
     params: t1(월별 원천징수) · tterm(간이세액표 주석) · t2(표는 개인 사정을 모름)
             · t3(연말정산) · t4(80/100/120 선택) · wipe -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  .stage { padding: 0 8%; gap: 0; }

  .head {
    font-size: 2.5vh; font-weight: 800; color: var(--brand-soft);
    margin-bottom: 2.4vh;
    animation-name: fadeUp; animation-duration: 0.5s;
  }

  .months { display: flex; gap: 0.9vh; align-items: flex-end; width: 100%; margin-bottom: 1.4vh; }
  .m {
    flex: 1; height: 7vh; border-radius: 0.6vh;
    background: color-mix(in srgb, var(--brand) 32%, transparent);
    transform-origin: bottom center;
    display: flex; align-items: flex-end; justify-content: center;
    font-size: 1.6vh; font-weight: 700; color: #b8d4cf; padding-bottom: 0.5vh;
  }
  @keyframes riseBar { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  .caption {
    width: 100%; text-align: left; font-size: 2vh; font-weight: 600;
    color: #8fa8a3; margin-bottom: 2.6vh;
  }

  .settle {
    width: 100%; display: flex; gap: 2vh; align-items: stretch; margin-bottom: 2.2vh;
  }
  .settle .box {
    flex: 1; padding: 1.8vh 2.2vh; border-radius: 1vh;
    background: #0d1917; border: 0.18vh solid #24403b;
    text-align: left; font-size: 2.1vh; font-weight: 700; color: #cfe2de; line-height: 1.45;
  }
  .settle .box.fix {
    border-color: var(--brand);
    background: color-mix(in srgb, var(--brand) 15%, transparent);
  }
  .settle .box .k { display: block; font-size: 1.85vh; color: var(--brand-soft); margin-bottom: 0.6vh; }

  .choice {
    width: 100%; padding: 1.7vh 2.2vh; border-radius: 1vh;
    background: color-mix(in srgb, var(--brand) 12%, transparent);
    border-left: 0.45vh solid var(--brand);
    text-align: left; font-size: 2.15vh; font-weight: 700; color: #dcece9;
  }
  .choice b { color: var(--brand-soft); }

  /* 용어 주석 — 상단(하단은 자막 자리) */
  .termnote {
    position: absolute; top: 3.4vh; right: 4.5vh; max-width: 41vh;
    padding: 1.6vh 2vh; border-radius: 1vh;
    background: rgb(4 14 12 / 0.92);
    border: 0.16vh solid color-mix(in srgb, var(--brand) 45%, transparent);
    text-align: left;
  }
  .termnote .abbr { font-size: 2.3vh; font-weight: 800; color: var(--brand-soft); }
  .termnote .full { font-size: 1.8vh; font-weight: 600; color: #8fa8a3; margin-top: 0.3vh; }
  .termnote .desc { font-size: 1.9vh; font-weight: 600; color: #d6e4e1; margin-top: 0.8vh; line-height: 1.4; }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="head animated">매달 뗀 소득세 — 확정값이 아니다</div>

  <div class="months" id="months"></div>
  <div class="caption animated" id="cap">1월부터 12월까지 — 간이세액표로 조회해 뗀 <b>임시값</b></div>

  <div class="settle">
    <div class="box animated" id="s1">
      <span class="k">표가 모르는 것</span>
      의료비 · 기부금 · 주택자금 — 개인의 사정
    </div>
    <div class="box fix animated" id="s2">
      <span class="k">이듬해 2월 · 연말정산</span>
      실제 세액을 다시 계산해 차액을 돌려주거나 더 받는다
    </div>
  </div>

  <div class="choice animated" id="s3">
    근로자는 간이세액표 금액의 <b>80% · 100% · 120%</b> 중 고를 수 있다 —
    이 선택값도 사원별로 저장해야 한다
  </div>
</div>

<div class="termnote animated" id="term">
  <div class="abbr">간이세액표</div>
  <div class="full">근로소득 간이세액표 · 국세청</div>
  <div class="desc">급여와 부양가족 수로 매달 뗄 세액을 찾는 표 — 계산이 아니라 조회다</div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  // 사전 점검이 q.get('이름') 리터럴로 파라미터를 센다 — 명시적으로 한 번 읽는다.
  const P = { t1: q.get('t1'), t2: q.get('t2'), t3: q.get('t3'), t4: q.get('t4'), tterm: q.get('tterm') };
  const at = (k, d) => { const v = parseFloat(P[k]); return Number.isFinite(v) ? v : d; };

  const t1 = at('t1', 4), t2 = at('t2', 25), t3 = at('t3', 38), t4 = at('t4', 55);

  // 12개월 막대가 차례로 선다 — 쌓이는 것이 보인다
  const wrap = document.getElementById('months');
  for (let i = 1; i <= 12; i += 1) {
    const b = document.createElement('div');
    b.className = 'm animated';
    b.textContent = `${i}월`;
    b.style.animationName = 'riseBar';
    b.style.animationDuration = '0.3s';
    b.style.animationDelay = `${t1 + i * 0.18}s`;
    b.style.animationFillMode = 'both';
    b.style.animationPlayState = 'paused';
    wrap.appendChild(b);
  }

  [['cap', t1 + 2.6], ['s1', t2], ['s2', t3], ['s3', t4]].forEach(([id, d]) => {
    const el = document.getElementById(id);
    el.style.animationName = 'fadeUp';
    el.style.animationDuration = '0.5s';
    el.style.animationDelay = `${d}s`;
  });
  const term = document.getElementById('term');
  term.style.animationName = 'fadeUp';
  term.style.animationDuration = '0.5s';
  term.style.animationDelay = `${at('tterm', 11)}s`;
</script>
