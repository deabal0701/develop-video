<!doctype html>
<meta charset="utf-8">
<title>정리</title>
<!-- 정리 도식 — 배운 것이 내레이션 순서로 쌓인다(rest-outro.html 패턴).
     스킬 규약: recap 은 용어로 잠근다 — 일상어 풀이와 정식 용어를 병기해
     "오늘 배운 말" 자체가 산출물이 되게 한다.
     params: t1·t2·t3(세 줄) · tn(마지막 한 줄) · wipe -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  .stage { padding: 0 12%; gap: 0; }

  .row {
    display: flex;
    align-items: center;
    gap: 2.6vh;
    width: 100%;
    padding: 2vh 2.6vh;
    margin-bottom: 1.6vh;
    border-radius: 1.2vh;
    background: color-mix(in srgb, var(--brand) 9%, transparent);
    border-left: 0.45vh solid var(--brand);
    text-align: left;
  }
  .n {
    flex: none;
    width: 4.6vh;
    height: 4.6vh;
    border-radius: 999px;
    background: var(--brand);
    color: #fff;
    font-size: 2.2vh;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .body { flex: 1; }
  .plain { font-size: 2.9vh; font-weight: 700; line-height: 1.3; }
  /* 정식 용어 병기 — 오늘 배운 말이 산출물이 된다 */
  .term {
    display: inline-block;
    margin-top: 0.7vh;
    padding: 0.4vh 1.2vh;
    border-radius: 0.6vh;
    background: color-mix(in srgb, var(--brand) 26%, transparent);
    font-size: 1.95vh;
    font-weight: 700;
    color: var(--brand-soft);
  }

  .close {
    margin-top: 2.6vh;
    font-size: 3.4vh;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .close span { color: var(--brand-soft); }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="row animated" id="r1">
    <span class="n">1</span>
    <span class="body">
      <span class="plain">아는 것을 먼저 건넨다</span>
      <span class="term">배경 재료 = 컨텍스트</span>
    </span>
  </div>
  <div class="row animated" id="r2">
    <span class="n">2</span>
    <span class="body">
      <span class="plain">설명 대신 예전 문서를 보여준다</span>
      <span class="term">예시 몇 개 = 퓨샷(few-shot)</span>
    </span>
  </div>
  <div class="row animated" id="r3">
    <span class="n">3</span>
    <span class="body">
      <span class="plain">숫자·이름·날짜는 사람이 확인한다</span>
      <span class="term">사실 확인 = 팩트체크</span>
    </span>
  </div>

  <div class="close animated" id="close">초안은 <span>기계가</span>, 판단은 <span>사람이</span></div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  // 사전 점검이 q.get('이름') 리터럴로 파라미터를 센다 — 명시적으로 한 번 읽는다.
  const P = { t1: q.get('t1'), t2: q.get('t2'), t3: q.get('t3'), tn: q.get('tn') };
  const at = (k, d) => { const v = parseFloat(P[k]); return Number.isFinite(v) ? v : d; };
  [['r1', at('t1', 3)], ['r2', at('t2', 8)], ['r3', at('t3', 13)], ['close', at('tn', 16)]]
    .forEach(([id, d]) => {
      const el = document.getElementById(id);
      el.style.animationName = 'fadeUp';
      el.style.animationDuration = '0.5s';
      el.style.animationDelay = `${d}s`;
    });
</script>
