<!doctype html>
<meta charset="utf-8">
<title>오늘의 약속</title>
<!-- 약속 도식 — 오늘 가져갈 세 가지. 항목이 내레이션 순서로 하나씩 선다.
     목차가 아니라 약속이다(스킬: 상세 목차는 챕터 카드와 유튜브 챕터가 담당).
     params: t1·t2·t3 (항목 등장 시각) · wipe -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  .stage { padding: 0 13%; gap: 0; }

  .head {
    font-size: 3.4vh;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 4.2vh;
    animation-name: fadeUp;
    animation-duration: 0.5s;
  }
  .head span { color: var(--brand-soft); }

  .row {
    display: flex;
    align-items: center;
    gap: 2.4vh;
    width: 100%;
    padding: 2.2vh 2.8vh;
    margin-bottom: 1.8vh;
    border-radius: 1.2vh;
    background: color-mix(in srgb, var(--brand) 9%, transparent);
    border-left: 0.45vh solid var(--brand);
    text-align: left;
  }
  .n {
    flex: none;
    width: 5vh;
    height: 5vh;
    border-radius: 999px;
    background: var(--brand);
    color: #fff;
    font-size: 2.4vh;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .t { font-size: 3vh; font-weight: 700; line-height: 1.3; }
  .t em {
    display: block;
    margin-top: 0.5vh;
    font-size: 2.1vh;
    font-weight: 600;
    font-style: normal;
    color: #98a1b8;
  }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="head animated">문서를 맡길 때, <span>세 가지</span></div>

  <div class="row animated" id="r1">
    <span class="n">1</span>
    <span class="t">재료를 먼저 건넨다<em>목적 · 읽는 사람 · 조건 · 분량</em></span>
  </div>
  <div class="row animated" id="r2">
    <span class="n">2</span>
    <span class="t">형식은 보여준다<em>설명 대신 예전 문서 한 장</em></span>
  </div>
  <div class="row animated" id="r3">
    <span class="n">3</span>
    <span class="t">검산은 사람이 한다<em>숫자 · 이름 · 날짜</em></span>
  </div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  // 사전 점검이 q.get('이름') 리터럴로 파라미터를 센다 — 명시적으로 한 번 읽는다.
  const P = { t1: q.get('t1'), t2: q.get('t2'), t3: q.get('t3') };
  ['t1', 't2', 't3'].forEach((k, i) => {
    const d = parseFloat(P[k]);
    const el = document.getElementById(`r${i + 1}`);
    el.style.animationName = 'fadeUp';
    el.style.animationDuration = '0.5s';
    el.style.animationDelay = `${Number.isFinite(d) ? d : 1 + i}s`;
  });
</script>
