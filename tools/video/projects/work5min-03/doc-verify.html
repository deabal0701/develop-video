<!doctype html>
<meta charset="utf-8">
<title>검산은 사람 몫</title>
<!-- 3장 도식 — 수치(40%/18%)가 막대로 자라고, 이어서 초안 위 숫자·이름에
     체크가 하나씩 붙는다. 두 기법이 겹치지 않게 시간으로 분리한다:
     앞 절반은 그래프, 뒤 절반은 검산 체크(화면이 갈아엎어지지 않고 아래로 이어짐).
     수치 근거: Noy & Zhang, Science 2023 (facts.md).
     params: t1(막대) · t2(한정) · t3(평준화) · t4(검산) · wipe -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  .stage { padding: 0 9%; gap: 0; }

  .head {
    font-size: 2.6vh;
    font-weight: 800;
    color: var(--brand-soft);
    margin-bottom: 2.6vh;
    animation-name: fadeUp;
    animation-duration: 0.5s;
  }

  /* 막대 두 개 */
  .bars { display: flex; gap: 4vh; width: 100%; margin-bottom: 2.2vh; }
  .bar-wrap { flex: 1; text-align: left; }
  .bar-label { font-size: 2.2vh; font-weight: 700; color: #aab3c7; margin-bottom: 0.9vh; }
  .track {
    height: 5.4vh;
    border-radius: 0.8vh;
    background: #191e2b;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    border-radius: 0.8vh;
    background: linear-gradient(90deg, var(--brand), var(--brand-soft));
    transform-origin: left center;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 1.6vh;
    font-size: 2.6vh;
    font-weight: 800;
    color: #fff;
  }
  .bar.b1 { width: 40%; }
  .bar.b2 { width: 18%; }
  @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .cite {
    font-size: 1.95vh;
    font-weight: 600;
    color: #8d97ad;
    margin-bottom: 2.6vh;
    animation-name: fadeUp;
    animation-duration: 0.5s;
  }

  /* 검산 — 초안 위 항목에 체크 */
  .verify {
    width: 100%;
    padding: 2.2vh 2.6vh;
    border-radius: 1.2vh;
    background: #10131c;
    border: 0.18vh solid #232838;
    text-align: left;
  }
  .verify-h {
    font-size: 2vh;
    font-weight: 800;
    color: #7d879e;
    letter-spacing: 0.03em;
    margin-bottom: 1.6vh;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 1.6vh;
    font-size: 2.4vh;
    font-weight: 700;
    color: #d3d9e6;
    margin-bottom: 1.1vh;
  }
  .item .box {
    flex: none;
    width: 3.2vh;
    height: 3.2vh;
    border-radius: 0.6vh;
    border: 0.24vh solid #48516a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.1vh;
    font-weight: 900;
    color: transparent;
  }
  .item .who {
    margin-left: auto;
    font-size: 2vh;
    font-weight: 800;
    color: var(--brand-soft);
  }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="head animated">챗GPT를 쓴 쪽의 변화</div>

  <div class="bars">
    <div class="bar-wrap">
      <div class="bar-label">작성 시간</div>
      <div class="track"><div class="bar b1 animated" id="bar1">−40%</div></div>
    </div>
    <div class="bar-wrap">
      <div class="bar-label">결과물 품질</div>
      <div class="track"><div class="bar b2 animated" id="bar2">+18%</div></div>
    </div>
  </div>

  <div class="cite animated" id="cite">
    대졸 전문직 453명 무작위 대조 실험 · Noy &amp; Zhang, <i>Science</i> 2023
  </div>

  <div class="verify animated" id="verify">
    <div class="verify-h">초안에 들어간 것 — 누가 확인하나</div>
    <div class="item" id="i1"><span class="box">✓</span>금요일 저녁 7시<span class="who">사람</span></div>
    <div class="item" id="i2"><span class="box">✓</span>회사 앞 식당 이름<span class="who">사람</span></div>
    <div class="item" id="i3"><span class="box">✓</span>우리 팀 12명<span class="who">사람</span></div>
  </div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  // 사전 점검이 q.get('이름') 리터럴로 파라미터를 센다 — 명시적으로 한 번 읽는다.
  const P = { t1: q.get('t1'), t2: q.get('t2'), t3: q.get('t3'), t4: q.get('t4') };
  const at = (k, d) => { const v = parseFloat(P[k]); return Number.isFinite(v) ? v : d; };

  const t1 = at('t1', 7), t2 = at('t2', 20), t3 = at('t3', 30), t4 = at('t4', 45);

  [['bar1', t1], ['bar2', t1 + 0.6]].forEach(([id, d]) => {
    const el = document.getElementById(id);
    el.style.animationName = 'growX';
    el.style.animationDuration = '0.8s';
    el.style.animationDelay = `${d}s`;
    el.style.animationTimingFunction = 'cubic-bezier(0.2,0.7,0.2,1)';
  });
  const cite = document.getElementById('cite');
  cite.style.animationDelay = `${t2}s`;

  const v = document.getElementById('verify');
  v.style.animationName = 'fadeUp';
  v.style.animationDuration = '0.5s';
  v.style.animationDelay = `${t3}s`;

  // 체크가 하나씩 켜진다 — 검산하는 것이 보인다
  const st = document.createElement('style');
  st.textContent = '@keyframes tick{from{color:transparent;border-color:#48516a}to{color:#9de8b9;border-color:#9de8b9}}';
  document.head.appendChild(st);
  ['i1', 'i2', 'i3'].forEach((id, i) => {
    const box = document.querySelector(`#${id} .box`);
    box.style.animationName = 'tick';
    box.style.animationDuration = '0.35s';
    box.style.animationDelay = `${t4 + i * 0.7}s`;
    box.style.animationFillMode = 'both';
    box.style.animationPlayState = 'paused';
    box.classList.add('animated');
  });
</script>
