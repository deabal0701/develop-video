<!doctype html>
<meta charset="utf-8">
<title>rest stateless</title>
<!-- 4장 도식 — 무상태. 왼쪽: 서버의 기억에 기대는 대화(서버 한 대에 묶이고, 끊기면 잃는다).
     오른쪽: 완결된 요청(누구·무엇·어떻게가 전부 적혀 있어 아무 서버나 받아도 된다).
     오른쪽 서버가 늘어나는 것으로 "그래서 확장이 된다"까지 그림이 진다.

     params: title · left · right · note · wipe=off
     주의: `animation:` 단축 속성 금지. -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  :root { --bg: #070b14; --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
          --ok: #2bd97c; --bad: #f4586a; }

  .stage { padding: 0 12%; gap: 3.4vh; }

  .head {
    font-size: 5vh;
    font-weight: 800;
    letter-spacing: -0.03em;
    animation-name: fadeUp;
    animation-duration: 0.7s;
  }

  .panes { display: flex; gap: 2.8vh; width: 100%; }
  .pane {
    flex: 1;
    padding: 2.6vh 2.4vh;
    border-radius: 2vh;
    background: #0e1526;
    border: 0.25vh solid #223052;
    animation-name: fadeUp;
    animation-duration: 0.6s;
  }
  /* 내레이션과 동행 — 왼쪽(기억)은 "기억하지 않는다"(~4초)부터,
     오른쪽(완결)은 "요청 한 줄에는 전부"(~11초)부터, 서버 증설은 "아무 서버가"(~25초)부터 */
  .pane.no  { animation-delay: 3.5s; }
  .pane.yes { animation-delay: 11s; border-color: color-mix(in srgb, var(--ok) 45%, #223052); }

  .pane .cap { font-size: 2.7vh; font-weight: 800; }
  .no  .cap { color: #ffb9c2; }
  .yes .cap { color: #9ff0c4; }

  .diagram { position: relative; height: 30vh; margin-top: 2vh; }

  /* 공통 부품 — 요청 쪽지와 서버 상자 */
  .memo {
    position: absolute;
    width: 34%;
    padding: 1.3vh 1.5vh;
    border-radius: 1.2vh;
    background: #131c31;
    border: 0.2vh solid #2b3a5e;
    font-size: 1.85vh;
    font-weight: 600;
    text-align: left;
    line-height: 1.45;
    color: #a9b8da;
  }
  .memo b { color: #d7e2ff; }
  .srv {
    position: absolute;
    width: 22%;
    padding: 1.6vh 0 1.2vh;
    border-radius: 1.2vh;
    background: #22314f;
    border: 0.2vh solid #3b4f7c;
    font-size: 2vh;
    font-weight: 700;
    color: #b9c6e8;
  }
  .srv::before {
    content: '';
    display: block;
    margin: 0 auto 0.9vh;
    width: 55%;
    height: 0.6vh;
    border-radius: 0.3vh;
    background: #55648a;
  }

  /* ── 왼쪽: 기억에 기대는 대화 ── */
  .no .memo { left: 0; top: 34%; animation-name: fadeUp; animation-duration: 0.5s; animation-delay: 4.5s; }
  .no .srv  { right: 4%; top: 32%; animation-name: fadeUp; animation-duration: 0.5s; animation-delay: 4.5s; }
  /* 서버 머리 위 기억 구름 */
  .no .think {
    position: absolute;
    right: 0;
    top: 0;
    width: 34%;
    padding: 1vh 1.2vh;
    border-radius: 1.6vh;
    background: #1a2440;
    border: 0.2vh dashed #55648a;
    font-size: 1.75vh;
    color: #8fa3c8;
    animation-name: fadeUp;
    animation-duration: 0.5s;
    animation-delay: 6s;
  }
  /* 대화 실 — 한 대에 묶인다. 끊기면(✕) 기억도 같이 사라진다 */
  .no .thread {
    position: absolute;
    left: 36%;
    right: 28%;
    top: 46%;
    height: 0;
    border-top: 0.4vh dashed #55648a;
    animation-name: fadeUp;
    animation-duration: 0.5s;
    animation-delay: 5s;
  }
  .no .cut {
    position: absolute;
    left: 44%;
    top: 36%;
    font-size: 4.2vh;
    font-weight: 800;
    color: var(--bad);
    animation-name: fadeUp;
    animation-duration: 0.5s;
    animation-delay: 8s;
  }
  .no .why {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    font-size: 2.1vh;
    font-weight: 700;
    color: #ffb9c2;
    animation-name: fadeUp;
    animation-duration: 0.5s;
    animation-delay: 9s;
  }

  /* ── 오른쪽: 완결된 요청 — 아무 서버나 ── */
  .yes .memo { left: 0; top: 26%; animation-name: fadeUp; animation-duration: 0.5s; animation-delay: 13s; }
  .yes .srv.s1 { right: 0; top: 2%;  animation-name: fadeUp; animation-duration: 0.5s; animation-delay: 25s; }
  .yes .srv.s2 { right: 0; top: 36%; animation-name: fadeUp; animation-duration: 0.5s; animation-delay: 25.5s; }
  .yes .srv.s3 { right: 0; top: 70%; animation-name: fadeUp; animation-duration: 0.5s; animation-delay: 26s; }
  .yes .arm {
    position: absolute;
    left: 37%;
    width: 36%;
    height: 0;
    border-top: 0.4vh solid var(--ok);
    transform-origin: left center;
    animation-name: grow;
    animation-duration: 0.5s;
  }
  @keyframes grow { from { transform: scaleX(0) rotate(var(--r, 0deg)); } to { transform: scaleX(1) rotate(var(--r, 0deg)); } }
  .yes .arm.a1 { top: 44%; --r: -16deg; animation-delay: 26.5s; }
  .yes .arm.a2 { top: 47%; --r: 0deg;   animation-delay: 27s; }
  .yes .arm.a3 { top: 50%; --r: 16deg;  animation-delay: 27.5s; }
  .yes .why {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    font-size: 2.1vh;
    font-weight: 700;
    color: #9ff0c4;
    animation-name: fadeUp;
    animation-duration: 0.5s;
    animation-delay: 28.5s;
  }

  .note {
    font-size: 3vh;
    font-weight: 600;
    color: var(--brand-soft);
    animation-name: fadeUp;
    animation-duration: 0.7s;
    animation-delay: 39s;
  }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="head animated" data-p="title"></div>

  <div class="panes">
    <div class="pane no animated">
      <div class="cap" data-p="left"></div>
      <div class="diagram">
        <div class="memo animated">"지워 줘"<br><b>(뭘…?)</b></div>
        <div class="thread animated"></div>
        <div class="cut animated">✕</div>
        <div class="srv animated">서버</div>
        <div class="think animated">"아까 그<br>얘기던가…"</div>
        <div class="why animated">끊기면 처음부터 다시</div>
      </div>
    </div>
    <div class="pane yes animated">
      <div class="cap" data-p="right"></div>
      <div class="diagram">
        <div class="memo animated">누구: 나 (열쇠 포함)<br>무엇: <b>/users/1</b><br>어떻게: <b>DELETE</b></div>
        <div class="arm a1 animated"></div>
        <div class="arm a2 animated"></div>
        <div class="arm a3 animated"></div>
        <div class="srv s1 animated">서버 1</div>
        <div class="srv s2 animated">서버 2</div>
        <div class="srv s3 animated">서버 3</div>
        <div class="why animated">아무 서버나 받아도 같다</div>
      </div>
    </div>
  </div>

  <div class="note animated" data-p="note"></div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
