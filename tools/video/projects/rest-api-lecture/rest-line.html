<!doctype html>
<meta charset="utf-8">
<title>rest line</title>
<!-- 요청 한 줄 해부 — `METHOD /path → STATUS` 를 크게 세우고, 세 조각(동사·주소·대답)에
     밑줄과 이름표가 차례로 붙는다. 훅 직후(DELETE→204)와 엔딩 회수(GET→404)에 같은
     템플릿을 params 만 바꿔 쓴다.

     params:
       title        상단 문구 (선택)
       method       동사 (DELETE, GET …)
       path         주소 (/users/1)
       status       대답 (204 No Content)
       mcolor       동사 색 (#f4586a 기본)
       scolor       대답 색 (#34d399 기본)
       labelMethod  동사 밑 이름표 (예: "동사 — 무엇을 할지")
       labelPath    주소 밑 이름표 (예: "주소 — 어떤 것에")
       labelStatus  대답 밑 이름표 (예: "대답 — 어떻게 됐는지")
       note         하단 보조 문구 (선택)
       wipe=off     모션끼리 이어질 때

     주의: `animation:` 단축 속성 금지. fadeUp 이 transform 을 덮어쓰므로
     가운데 정렬은 flex/text-align 으로만 한다. -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  :root { --bg: #05070d; --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
          --mcolor: #f4586a; --scolor: #34d399; }

  .stage { padding: 0 10%; gap: 5.5vh; }

  .head {
    font-size: 5vh;
    font-weight: 800;
    letter-spacing: -0.03em;
    animation-name: fadeUp;
    animation-duration: 0.7s;
  }

  /* ── 한 줄 — 세 조각이 한 문장으로 서 있다 ── */
  .line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 1.6ch;
    font-family: var(--mono);
    font-size: 5.8vh;
    font-weight: 700;
    white-space: nowrap;
    animation-name: fadeUp;
    animation-duration: 0.7s;
    animation-delay: 0.15s;
  }
  .line .method { color: var(--mcolor); }
  .line .arrow  { color: #55648a; font-size: 4.6vh; }
  .line .status { color: var(--scolor); }

  /* ── 조각별 밑줄 + 이름표 — 차례로 붙는다 ── */
  .part { position: relative; display: inline-block; }
  .part .ul {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1.6vh;
    height: 0.55vh;
    border-radius: 0.3vh;
    transform-origin: left center;
    animation-name: grow;
    animation-duration: 0.5s;
    animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .part .tag {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 2.6vh); /* 밑줄(bottom -1.6vh) 아래 — 글자 위에 겹치면 안 된다 */
    font-family: var(--font);
    font-size: 2.5vh;
    font-weight: 700;
    white-space: normal;
    line-height: 1.3;
    animation-name: fadeUp;
    animation-duration: 0.5s;
  }
  /* 밑줄·이름표 등장 시각은 내레이션에 맞춰 t1·t2·t3(초) params 로 받는다 —
     같은 템플릿을 훅 해설과 엔딩 회수에서 다른 말 속도로 쓰기 때문이다. */
  .m .ul { background: var(--mcolor); animation-delay: var(--t1, 1.0s); }
  .m .tag { color: var(--mcolor); animation-delay: calc(var(--t1, 1.0s) + 0.15s); }
  .p .ul { background: #7c93e8; animation-delay: var(--t2, 1.7s); }
  .p .tag { color: #9fb2f5; animation-delay: calc(var(--t2, 1.7s) + 0.15s); }
  .s .ul { background: var(--scolor); animation-delay: var(--t3, 2.4s); }
  .s .tag { color: var(--scolor); animation-delay: calc(var(--t3, 2.4s) + 0.15s); }

  .note {
    margin-top: 6vh;
    font-size: 3vh;
    font-weight: 600;
    color: var(--brand-soft);
    animation-name: fadeUp;
    animation-duration: 0.7s;
    animation-delay: var(--tn, 3.2s);
  }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="head animated" data-p="title"></div>

  <div class="line animated">
    <span class="part m"><span class="method" data-p="method"></span><i class="ul animated"></i><span class="tag animated" data-p="labelMethod"></span></span>
    <span class="part p"><span class="path" data-p="path"></span><i class="ul animated"></i><span class="tag animated" data-p="labelPath"></span></span>
    <span class="arrow">→</span>
    <span class="part s"><span class="status" data-p="status"></span><i class="ul animated"></i><span class="tag animated" data-p="labelStatus"></span></span>
  </div>

  <div class="note animated" data-p="note"></div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
<script>
  // 동사·대답 색은 쓰임(훅=삭제 빨강/성공 초록, 회수=조회 파랑/실패 주황)마다 바뀐다.
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  if (q.get('mcolor')) root.style.setProperty('--mcolor', q.get('mcolor'));
  if (q.get('scolor')) root.style.setProperty('--scolor', q.get('scolor'));
  // 리터럴 .get('…') 로 적는다 — preflight 가 템플릿이 받는 params 를 이 패턴으로 읽는다.
  const timing = { t1: q.get('t1'), t2: q.get('t2'), t3: q.get('t3'), tn: q.get('tn') };
  for (const [k, v] of Object.entries(timing)) {
    if (v) root.style.setProperty(`--${k}`, `${v}s`);
  }
</script>
