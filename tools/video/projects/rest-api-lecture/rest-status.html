<!doctype html>
<meta charset="utf-8">
<title>rest status</title>
<!-- 3장 도식 — 상태코드의 세 표정. 첫 자리만 보면 된다는 것을 얼굴(웃음·곤란·침울)로 보인다.
     "가장 자주 만나는 세 표정" — 세 가지뿐이라고 단정하지 않는다(1xx·3xx 실재).

     params: title · note · wipe=off
     주의: `animation:` 단축 속성 금지. -->
<link rel="stylesheet" href="../../motion/_base.css">
<style>
  :root { --bg: #070b14; --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
          --ok: #2bd97c; --warn: #f5a524; --bad: #f4586a; }

  .stage { padding: 0 12%; gap: 4vh; }

  .head {
    font-size: 5vh;
    font-weight: 800;
    letter-spacing: -0.03em;
    animation-name: fadeUp;
    animation-duration: 0.7s;
  }

  .cards { display: flex; gap: 2.6vh; width: 100%; }
  .card {
    flex: 1;
    padding: 3.4vh 2vh 3vh;
    border-radius: 2vh;
    background: #0e1526;
    border-style: solid;
    border-width: 0.25vh;
    animation-name: fadeUp;
    animation-duration: 0.6s;
  }
  /* 내레이션과 동행 — 도입 문장부터 상태코드 얘기라 2xx 는 일찍 깔고(빈 화면 9초 방지, 평가 지적),
     "4로"(~29초) → "5로"(~36.5초)는 언급 시각에 맞춘다 */
  .card.ok   { border-color: color-mix(in srgb, var(--ok) 55%, #223052);   animation-delay: 2.5s; }
  .card.warn { border-color: color-mix(in srgb, var(--warn) 55%, #223052); animation-delay: 29s; }
  .card.bad  { border-color: color-mix(in srgb, var(--bad) 55%, #223052);  animation-delay: 36.5s; }

  .card .code { font-family: var(--mono); font-size: 6.4vh; font-weight: 800; }
  .ok   .code { color: var(--ok); }
  .warn .code { color: var(--warn); }
  .bad  .code { color: var(--bad); }

  /* 표정 — 눈 두 점 + 입. 입 모양만 바꾼다 */
  .face { display: flex; flex-direction: column; align-items: center; gap: 1vh; margin: 2vh 0 1.6vh; }
  .eyes { display: flex; gap: 3.4vh; }
  .eyes i { width: 1.5vh; height: 1.5vh; border-radius: 50%; background: #d7e2ff; }
  .mouth { width: 6.4vh; height: 3vh; border-style: solid; border-color: #d7e2ff; border-width: 0; }
  .ok   .mouth { border-bottom-width: 0.6vh; border-radius: 0 0 6vh 6vh; }
  .warn .mouth { height: 0.4vh; border-bottom-width: 0.6vh; margin-top: 1.4vh; width: 5vh; }
  .bad  .mouth { border-top-width: 0.6vh; border-radius: 6vh 6vh 0 0; margin-top: 1vh; }

  .card .mean { font-size: 3vh; font-weight: 800; }
  .card .who  { margin-top: 0.8vh; font-size: 2.2vh; font-weight: 600; color: #8fa3c8; }
  .card .ex {
    margin-top: 1.8vh;
    font-family: var(--mono);
    font-size: 2.1vh;
    font-weight: 600;
    color: #a9b8da;
    line-height: 1.55;
  }

  .note {
    font-size: 3vh;
    font-weight: 600;
    color: var(--brand-soft);
    animation-name: fadeUp;
    animation-duration: 0.7s;
    animation-delay: 42s;
  }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="head animated" data-p="title"></div>

  <div class="cards">
    <div class="card ok animated">
      <div class="code">2xx</div>
      <div class="face"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div>
      <div class="mean">잘 됐습니다</div>
      <div class="who">성공</div>
      <div class="ex">200 OK<br>204 No Content</div>
    </div>
    <div class="card warn animated">
      <div class="code">4xx</div>
      <div class="face"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div>
      <div class="mean">요청 쪽 문제</div>
      <div class="who">부탁한 쪽이 다시 볼 것</div>
      <div class="ex">404 Not Found</div>
    </div>
    <div class="card bad animated">
      <div class="code">5xx</div>
      <div class="face"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div>
      <div class="mean">서버 쪽 문제</div>
      <div class="who">받은 쪽이 고칠 것</div>
      <div class="ex">500 Server Error</div>
    </div>
  </div>

  <div class="note animated" data-p="note"></div>
</div>

<div class="wipe animated"></div>

<script src="../../motion/_params.js"></script>
