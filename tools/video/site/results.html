<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>검색 결과 — 유튜브 화면 재현</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="main">
      <div id="filter-bar">
        <button id="btn-filter">⚙ 필터</button>
        <span style="color:#aaa;font-size:17px" id="result-count">약 1,240,000개의 결과</span>
      </div>

      <div id="filter-panel">
        <div class="f-col">
          <h4>업로드 날짜</h4>
          <div>지난 1시간</div>
          <div>오늘</div>
          <div id="f-week">이번 주</div>
          <div>올해</div>
        </div>
        <div class="f-col">
          <h4>구분</h4>
          <div>동영상</div>
          <div>채널</div>
          <div>재생목록</div>
        </div>
        <div class="f-col">
          <h4>길이</h4>
          <div id="f-short">4분 미만</div>
          <div>4~20분</div>
          <div>20분 초과</div>
        </div>
        <div class="f-col">
          <h4>기능</h4>
          <div>자막</div>
          <div>4K</div>
          <div>실시간</div>
        </div>
        <div class="f-col">
          <h4>정렬 기준</h4>
          <div class="on">관련성</div>
          <div id="f-new">업로드 날짜</div>
          <div>조회수</div>
        </div>
      </div>

      <div id="results"></div>
      <div class="pad-bottom"></div>
    </div>

    <script src="app.js"></script>
    <script>
      renderShell('home');

      const q = new URLSearchParams(location.search).get('q') || '아침 스트레칭';
      document.getElementById('search-input').value = q;

      const RESULTS = [
        ['🧘', '아침 10분 스트레칭 — 초보자도 따라 하는 기본 동작', '건강한하루 · 구독자 82만명',
         '조회수 128만회 · 3일 전', '10:24',
         '침대에서 일어나자마자 할 수 있는 동작만 모았습니다. 매트도 필요 없고, 처음 하시는 분도 그대로 따라 하실 수 있어요.'],
        ['🌅', '굳은 몸 푸는 5분 루틴 (자막 있음)', '스트레칭연구소 · 구독자 41만명',
         '조회수 63만회 · 1주 전', '05:12',
         '시간이 없을 때 딱 5분. 목·어깨·허리 순서로 짧게 풉니다.'],
        ['🛏', '자기 전 스트레칭 — 잠이 잘 오는 순서', '밤의루틴 · 구독자 27만명',
         '조회수 47만회 · 2주 전', '12:40',
         '하루를 마무리하며 천천히 호흡에 맞춰 따라 해 보세요.'],
        ['💪', '앉아서 하는 사무실 스트레칭 모음', '오피스핏 · 구독자 15만명',
         '조회수 22만회 · 5일 전', '08:03',
         '의자에 앉은 채로 할 수 있는 동작 8가지를 이어서 보여 드립니다.'],
      ];

      document.getElementById('results').innerHTML = RESULTS.map(
        ([emoji, title, ch, meta, dur, desc], i) => `
        <a class="row-card" href="watch.html">
          ${thumb(i, emoji, dur)}
          <div>
            <div class="row-title">${title}</div>
            <div class="row-meta">${meta}</div>
            <div class="row-ch"><span class="ch-avatar" style="width:32px;height:32px;flex:0 0 32px;font-size:15px;background:${art(i + 2)}">${ch[0]}</span>${ch}</div>
            <div class="row-desc">${desc}</div>
          </div>
        </a>`).join('');

      document.getElementById('btn-filter').addEventListener('click', () => {
        document.getElementById('filter-panel').classList.toggle('on');
      });
      document.querySelectorAll('.f-col div').forEach((d) =>
        d.addEventListener('click', () => {
          d.parentElement.querySelectorAll('div').forEach((x) => x.classList.remove('on'));
          d.classList.add('on');
        })
      );
    </script>
  </body>
</html>
